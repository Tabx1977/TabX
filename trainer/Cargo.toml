# Neural network trainer for the engine's evaluation, built on bullet
# (https://github.com/jw1912/bullet). Kept outside the engine's own crate so
# that building the engine never needs a GPU toolchain.
#
# Build and run through scripts/train.sh, which sets up the CUDA paths.
[package]
name = "tabx-trainer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bullet_lib = { git = "https://github.com/jw1912/bullet", rev = "5d70177680437b7c0ddf958bd4722d95afa78b0c", features = ["cuda"] }

[workspace]
